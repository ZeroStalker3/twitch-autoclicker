name: Build & Release UserScript

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Minify UserScript
        run: |
          npx terser src/twitch-autoclicker.user.js \
            --compress drop_console=true \
            --mangle reserved=['state','CONFIG'] \
            --output dist/twitch-autoclicker.min.user.js \
            --comments /^==UserScript==|@/

      - name: Update @version in minified file
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/@version.*/@version      $VERSION/" dist/twitch-autoclicker.min.user.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/twitch-autoclicker.min.user.js
          generate_release_notes: true
          draft: false